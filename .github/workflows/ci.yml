name: CI

# Every pull request gets the same checks, whoever (or whatever) wrote the change.
# main deploys the production site, so nothing reaches it without passing these.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # build first: rendered_skills_page.test.ts reads the built HTML
      - run: npm run build
      - run: npm test
